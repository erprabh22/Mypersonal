<!DOCTYPE html>
<html>
<head>
<title>Happy Valentine's Day ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff4e8a,#ff9a9e);
  font-family:Arial;
  text-align:center;
  color:white;
}
.card{
  background:rgba(255,255,255,0.2);
  padding:40px;
  border-radius:20px;
}
button{
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:white;
  color:#ff4e8a;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  transform:scale(1.1);
}
</style>
</head>
<body>

<div class="card">
<h1>Happy Valentine’s Day ❤️</h1>
<p>You make my world brighter every day.</p>
<button onclick="alert('I love you ❤️')">Click Me 💌</button>
</div>

</body>
</html>
